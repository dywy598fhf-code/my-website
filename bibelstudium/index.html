<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bibelstudium Bern</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--pwa-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bibelstudium">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f1ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)">
<!--/pwa-->
<style>
/* Layout: iOS-style grouped lists on a soft ground, one column, tab bar at the bottom */
:root{
  --bg:#f2f1ee; --card:#ffffff; --fg:#1c1c1e; --muted:#7a7873; --line:#e4e2dd;
  --btn:#1c1c1e; --btn-fg:#ffffff; --soft:#ebe9e4; --ok:#2e9e6a;
  --yes:rgba(46,158,106,.10); --no:rgba(217,72,95,.10);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.23,1,.32,1);
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0f10; --card:#1c1c1e; --fg:#f2f2f2; --muted:#9a9890; --line:#2c2c2e;
  --btn:#f2f2f2; --btn-fg:#111; --soft:#2a2a2c; --ok:#4cc38a; --yes:rgba(76,195,138,.16); --no:rgba(255,99,99,.16); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0f10; --card:#1c1c1e; --fg:#f2f2f2; --muted:#9a9890; --line:#2c2c2e;
  --btn:#f2f2f2; --btn-fg:#111; --soft:#2a2a2c; --ok:#4cc38a; --yes:rgba(76,195,138,.16); --no:rgba(255,99,99,.16); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px;display:flex;flex-direction:column;gap:28px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
.me{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--card);font-size:15px;font-weight:500;flex:none}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:600;flex:none}
.dot.sm{width:20px;height:20px;font-size:10px}
.label{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px 16px}
.group{background:var(--card);border-radius:14px;overflow:hidden}
.date{padding:18px 16px}
.date b{display:block;font-size:22px;letter-spacing:-.01em}
.date span{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:52px}
.row+.row{border-top:1px solid var(--line)}
.row .name{flex:1;min-width:0;overflow-wrap:anywhere}
.row .sub{display:block;font-size:14px;color:var(--muted)}
.tag{font-size:13px;color:var(--muted);flex:none}
.empty{padding:14px 16px;color:var(--muted);font-size:14px}
.row.yes{background:var(--yes)}.row.no{background:var(--no)}
.row.yes+.row,.row.no+.row{border-top-color:transparent}
.row.head{font-weight:600;min-height:48px}
.row.sub-row{padding-left:56px}
.row.done .name{opacity:.45}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:50px;border-radius:12px;background:var(--soft);font-weight:600;transition:transform .16s var(--ease),background .2s}
.btn:active{transform:scale(.97)}
.btn.on{background:var(--btn);color:var(--btn-fg)}
.wide{grid-column:1/-1}
.note{font-size:12px;color:var(--muted);text-align:center;margin:0;opacity:.8}
/* add form */
.add{display:flex;flex-direction:column;gap:0}
.add input{width:100%;border:0;background:transparent;padding:14px 16px;font-size:16px;min-width:0}
.add input+input{border-top:1px solid var(--line)}
.add input::placeholder{color:var(--muted)}
.add .btn{margin-top:10px;width:100%}
.add .btn:disabled{opacity:.4}
/* small pill buttons in rows */
.pill{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:600;flex:none;transition:transform .16s var(--ease)}
.pill:active{transform:scale(.95)}
.pill.on{background:var(--btn);color:var(--btn-fg)}
.pill.done.on{background:var(--ok);color:#fff}
.del{font-size:13px;color:var(--muted);padding:6px 0 6px 4px;flex:none}
.del.arm{color:#d9485f;font-weight:600}
.voters{display:flex;gap:2px;margin-top:4px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 16px;text-decoration:none}
.tab svg{width:24px;height:24px}
.tab.active{color:var(--fg)}
/* name sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s var(--ease)}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .35s var(--ease);display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:20px}
.sheet p{margin:0;color:var(--muted)}
.pickname{text-align:left;font-size:16px;padding:6px 0}
.pickname:active{opacity:.6}
.hright{display:flex;align-items:center;gap:8px;flex:none}
.gear{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--fg)}
.gear svg{width:22px;height:22px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;justify-content:center;line-height:1;height:36px;padding:0 14px;border-radius:999px;background:var(--card);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--btn);color:var(--btn-fg)}
.chip.add{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.date .lbl{display:block;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.date{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg button{height:34px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;min-height:52px}
.field+.field{border-top:1px solid var(--line)}
.field select,.field input{border:0;background:var(--soft);border-radius:8px;padding:8px 10px;font-size:16px;color:var(--fg);min-width:0}
textarea.note-in{width:100%;border:0;background:transparent;padding:14px 16px;font-size:16px;line-height:1.5;min-height:160px;resize:vertical;display:block}
textarea.note-in::placeholder,.add textarea::placeholder{color:var(--muted)}
.add textarea{width:100%;border:0;background:transparent;padding:14px 16px;font-size:16px;min-height:80px;resize:vertical;display:block}
.title-in{width:100%;border:0;background:transparent;font-size:24px;font-weight:700;letter-spacing:-.01em;padding:0}
.sheet.tall{min-height:80%}
.row .name.link{cursor:pointer}
.ntag{font-size:12px;color:var(--muted);margin-left:6px}
.sheet .label{margin-top:4px}
.field input.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;transition:background .2s;flex:none;padding:0;margin:0;cursor:pointer}
.field input.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
.field input.switch:checked{background:var(--ok)}
.field input.switch:checked::after{transform:translateX(20px)}
.field input.switch:disabled{opacity:.5}
#nMsg{text-align:left;margin-top:8px}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.view{display:flex;flex-direction:column;gap:28px;animation:pop .3s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Bibelstudium</h1>
    <div class="hright">
      <button class="gear" id="gear" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button class="me" id="me" aria-label="Person wechseln"></button>
    </div>
  </header>

  <!-- Treffen -->
  <div class="view" id="v-treffen">
    <div class="chips" id="chips" role="tablist" aria-label="Treffen auswählen"></div>
    <section>
      <div class="group date"><div><span class="lbl" id="whenLbl">Nächstes Treffen</span><b id="when"></b><span id="whenTime"></span></div><span id="whenDel"></span></div>
    </section>
    <section>
      <p class="label">Es kocht</p>
      <div class="group" id="cook"></div>
    </section>
    <section>
      <p class="label" id="countLabel">Dabei</p>
      <div class="group" id="list"></div>
    </section>
    <div class="actions">
      <button class="btn" id="bYes">Ich bin dabei</button>
      <button class="btn" id="bNo">Ich kann nicht</button>
      <button class="btn wide" id="bCook">Ich koche</button>
    </div>
  </div>

  <!-- Themen -->
  <div class="view" id="v-themen" hidden>
    <form class="add" id="fTopic">
      <p class="label">Neu</p>
      <div class="group"><input id="tTopic" maxlength="120" placeholder="Worüber möchtest du reden?" autocomplete="off"></div>
      <button class="btn on" id="bTopic" disabled>Hinzufügen</button>
    </form>
    <section>
      <p class="label">Wünsche</p>
      <div class="group" id="topics"></div>
    </section>
  </div>

  <!-- Gebet -->
  <div class="view" id="v-gebet" hidden>
    <form class="add" id="fPrayer">
      <p class="label">Neu</p>
      <div class="group">
        <input id="pName" maxlength="40" placeholder="Vorname" autocomplete="off">
        <input id="pText" maxlength="140" placeholder="Anliegen (optional)" autocomplete="off">
      </div>
      <button class="btn on" id="bPrayer" disabled>Hinzufügen</button>
    </form>
    <div id="prayers" style="display:flex;flex-direction:column;gap:16px"></div>
    <p class="note">Bitte nur Vornamen.</p>
  </div>

  <p class="note" id="demoNote">Testversion · nur auf deinem Handy gespeichert</p>
</div>

<nav class="tabs">
  <a class="tab" href="#treffen" data-v="treffen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Treffen</a>
  <a class="tab" href="#themen" data-v="themen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4.5h11a3 3 0 0 1 3 3V19.5H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h4"/></svg>Themen</a>
  <a class="tab" href="#gebet" data-v="gebet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Gebet</a>
</nav>

<script>

/* ---------- Personen und Farben (Beispielnamen nur für die Testversion) ---------- */
const PALETTE=["#2f6fdb","#d9485f","#2e9e6a","#c27c0e","#7b4fd6","#d0557f","#1597a6","#8a6a4f","#5a6b7d","#a3456b","#4f7a28","#c4501f"];
const DEMO_PEOPLE=[
  {n:"Kevin",c:"#2f6fdb"},{n:"Anna",c:"#d9485f"},{n:"Jonas",c:"#2e9e6a"},
  {n:"Lea",c:"#c27c0e"},{n:"Micha",c:"#7b4fd6"},{n:"Sarah",c:"#d0557f"},
  {n:"Tim",c:"#1597a6"},{n:"Ruth",c:"#8a6a4f"},{n:"David",c:"#5a6b7d"},{n:"Esther",c:"#a3456b"}
];
const DEFAULT_CONFIG={weekday:4,time:"19:30",extras:[]}; // 0 = Sonntag … 4 = Donnerstag
/* Benachrichtigungen: öffentlicher Schlüssel aus Firebase → Projekteinstellungen → Cloud Messaging → Web-Push-Zertifikate */
const VAPID_KEY="BEVlauu9_zm6JjL4gwcbpyNd71cyx2EA5Gmk7IL1-pCj-cCcvKxG1Yj8Hjr3q18Zf9TwcWqRTDRXefGsz1nZTSE";
const WEEKDAYS=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];

/* ---------- Firebase: hier den firebaseConfig-Block einsetzen. Leer = nur auf diesem Handy. ---------- */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyD3ju2NJdXk5gtu3YLDIkFpdhsjnXVXoJc",
  authDomain:"bibestudium-webapp.firebaseapp.com",
  projectId:"bibestudium-webapp",
  storageBucket:"bibestudium-webapp.firebasestorage.app",
  messagingSenderId:"94060783002",
  appId:"1:94060783002:web:c145f9913bbd8b436b4623"
};
const FB="https://www.gstatic.com/firebasejs/11.0.2/";

/* ---------- Speicher auf dem Handy ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem("ba-"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("ba-"+k,JSON.stringify(v))}catch(e){}}
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let me=store.get("me",null);

/* ---------- Darstellung (Hell/Dunkel) ---------- */
let theme=store.get("theme","system");
const applyTheme=()=>{if(theme==="system")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=theme};
applyTheme();

// Beispieldaten nur für die Testversion ohne Firebase
const DEMO=!FIREBASE_CONFIG;
let people=DEMO?store.get("people",DEMO_PEOPLE):[];
let config=DEMO?store.get("config",DEFAULT_CONFIG):{...DEFAULT_CONFIG};
let meets=DEMO?store.get("meets",{}):{}; // Schlüssel = Treffen, Wert = {cook,status}
let topics=DEMO?store.get("topics",[
  {id:"t1",text:"Wie bete ich, wenn mir die Worte fehlen?",by:"Lea",votes:["Kevin","Sarah","Tim"],t:2,notes:"Ich merke oft, dass ich beim Beten nicht weiß, was ich sagen soll. Vielleicht können wir die Psalmen als Gebete anschauen?"},
  {id:"t2",text:"Das Buch Jona",by:"Jonas",votes:["Anna"],t:1}
]):[];
let prayers=DEMO?store.get("prayers",[
  {id:"p1",name:"Markus",text:"Neue Arbeitsstelle",by:"Tim",done:false,t:3},
  {id:"p3",name:"Sophie",text:"Prüfungen im Studium",by:"Tim",done:false,t:2},
  {id:"p2",name:"Julia",text:"Gesundheit nach der OP",by:"Anna",done:true,t:1}
]):[];
let wishes=DEMO?store.get("wishes",[]):[];
const saveLocal=()=>{if(DEMO){store.set("people",people);store.set("config",config);store.set("meets",meets);store.set("topics",topics);store.set("prayers",prayers);store.set("wishes",wishes)}};

/* ---------- Gemeinsamer Speicher (Firebase) ---------- */
const R={on:false};
let code=store.get("code",null); // Gruppencode: die Daten liegen unter groups/<code>/…
/* Einladungslink: …/bibelstudium/?g=<code> setzt die Gruppe automatisch */
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const invite=(new URLSearchParams(location.search).get("g")||"").trim().toLowerCase().replace(/[\/.#$\[\]\s]/g,"");
let fromInvite=false;
if(invite&&!DEMO&&(!code||(!standalone&&invite!==code))){
  if(invite!==code){me=null;store.set("me",null)}
  code=invite;store.set("code",code);fromInvite=true;
}
const inviteUrl=()=>location.origin+location.pathname+"?g="+encodeURIComponent(code);
const leaveGroup=()=>{store.set("code",null);store.set("me",null);location.href=location.pathname};
const P=(...parts)=>["groups",code,...parts];
async function connect(){
  if(R.F)return;
  const [A,Au,F]=await Promise.all([import(FB+"firebase-app.js"),import(FB+"firebase-auth.js"),import(FB+"firebase-firestore.js")]);
  const app=A.initializeApp(FIREBASE_CONFIG);
  await Au.signInAnonymously(Au.getAuth(app));
  Object.assign(R,{F,app,db:F.getFirestore(app)});
}
function refreshSheet(kind,fn){const s=document.querySelector(".sheet-bg");if(s&&s.dataset.kind===kind)fn()}
async function initFirebase(){
  if(!FIREBASE_CONFIG)return;
  if(!code){askCode();return}
  $("demoNote").textContent="Verbinde …";
  try{
    await connect();
    const {F,db}=R;
    if(fromInvite&&!(await F.getDoc(F.doc(db,"groups",code,"meta","info"))).exists()){
      code=null;store.set("code",null);$("demoNote").textContent="";document.querySelector(".sheet-bg")?.remove();askCode("Dieser Einladungslink stimmt nicht. Frag in der WhatsApp-Gruppe nach dem richtigen.");return}
    R.on=true;
    F.onSnapshot(F.collection(db,...P("meetings")),q=>{meets={};q.docs.forEach(d=>{const v=d.data();meets[d.id]={cook:v.cook||null,status:v.status||{}}});render()});
    F.onSnapshot(F.doc(db,...P("meta","config")),d=>{config={...DEFAULT_CONFIG,...(d.data()||{})};render();refreshSheet("settings",fillSettings)});
    F.onSnapshot(F.doc(db,...P("meta","people")),d=>{people=(d.data()||{}).list||[];render();refreshSheet("pick",fillPick)});
    F.onSnapshot(F.collection(db,...P("topics")),q=>{topics=q.docs.map(d=>({id:d.id,votes:[],...d.data()}));render();refreshSheet("topic",fillTopic)});
    F.onSnapshot(F.collection(db,...P("prayers")),q=>{prayers=q.docs.map(d=>({id:d.id,...d.data()}));render()});
    F.onSnapshot(F.collection(db,...P("wishes")),q=>{wishes=q.docs.map(d=>({id:d.id,...d.data()}));refreshSheet("settings",fillWishes)});
    $("demoNote").hidden=true;
    if(notifOn()&&"Notification" in window&&Notification.permission==="granted")saveDevice().catch(e=>console.warn(e));
    if(!me)pick();
  }catch(e){console.warn("Firebase nicht erreichbar",e);$("demoNote").textContent="Keine Verbindung · Einträge werden gerade nicht geteilt"}
}
/* Gruppencode beim ersten Öffnen */
function askCode(msg){
  const bg=document.createElement("div");bg.className="sheet-bg";
  bg.innerHTML=`<form class="sheet add" id="codeForm" aria-label="Gruppencode"><h2>Willkommen</h2><p id="codeMsg">${esc(msg||"Öffne den Einladungslink aus der WhatsApp-Gruppe. Oder gib hier den Gruppencode ein.")}</p>
    <div class="group"><input id="codeIn" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Code eingeben"></div>
    <button class="btn on" id="codeBtn">Weiter</button></form>`;
  document.body.appendChild(bg);
  const norm=()=>$("codeIn").value.trim().toLowerCase().replace(/\s+/g,"-").replace(/[\/.#$\[\]]/g,"");
  const done=c=>{code=c;store.set("code",c);bg.remove();initFirebase()};
  $("codeForm").onsubmit=async e=>{e.preventDefault();const c=norm();if(c.length<4){$("codeMsg").textContent="Der Code ist zu kurz.";return}
    $("codeBtn").disabled=true;$("codeMsg").textContent="Prüfe …";
    try{await connect();const snap=await R.F.getDoc(R.F.doc(R.db,"groups",c,"meta","info"));
      if(snap.exists())done(c);else $("codeMsg").textContent="Diesen Code gibt es nicht. Prüfe die Schreibweise."
    }catch(err){console.warn(err);$("codeMsg").textContent="Keine Verbindung. Bitte später nochmal versuchen."}
    $("codeBtn").disabled=false};
}
const remote=fn=>{if(R.on)fn(R.F,R.db).catch(e=>console.warn(e))};

/* ---------- Treffen: wöchentlich plus weitere Termine ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
function upcoming(){
  const today=new Date();today.setHours(0,0,0,0);
  const w=new Date(today);w.setDate(w.getDate()+((config.weekday-w.getDay()+7)%7));
  const list=[{key:ymd(w),date:w,time:config.time,label:"",weekly:true}];
  (config.extras||[]).forEach(x=>{const d=parseYmd(x.date);if(d>=today)list.push({key:"x-"+x.id,date:d,time:x.time,label:x.label||"",by:x.by,x})});
  return list.sort((a,b)=>a.date-b.date||String(a.time).localeCompare(String(b.time)));
}
let sel=null;
const curMeeting=()=>{const u=upcoming();return u.find(m=>m.key===sel)||(sel&&!sel.startsWith("x-")&&u.find(m=>m.weekly))||u[0]};
const cur=()=>{const k=curMeeting().key;return meets[k]||(meets[k]={cook:null,status:{}})};
const meetRef=()=>R.F.doc(R.db,...P("meetings",curMeeting().key));

/* Alle Änderungen laufen über diese Funktionen */
const ops={
  setStatus(st){ // "yes" | "no" | null
    const m=cur();
    if(st)m.status[me]=st;else delete m.status[me];
    const cookOff=m.cook===me&&st!=="yes"; if(cookOff)m.cook=null;
    remote(F=>F.setDoc(meetRef(),{status:{[me]:st||F.deleteField()},...(cookOff?{cook:null}:{})},{merge:true}));
  },
  setCook(on){
    const m=cur();m.cook=on?me:null; if(on)m.status[me]="yes";
    remote(F=>F.setDoc(meetRef(),{cook:m.cook,...(on?{status:{[me]:"yes"}}:{})},{merge:true}));
  },
  setWeekly(weekday,time){config={...config,weekday,time};
    remote((F,db)=>F.setDoc(F.doc(db,...P("meta","config")),{weekday,time},{merge:true}))},
  addExtra(date,time,label){const x={id:uid(),date,time,label,by:me};config={...config,extras:[...(config.extras||[]),x]};sel="x-"+x.id;
    remote((F,db)=>F.setDoc(F.doc(db,...P("meta","config")),{extras:F.arrayUnion(x)},{merge:true}))},
  removeExtra(id){const x=(config.extras||[]).find(e=>e.id===id);if(!x)return;config={...config,extras:config.extras.filter(e=>e!==x)};sel=null;
    remote((F,db)=>F.setDoc(F.doc(db,...P("meta","config")),{extras:F.arrayRemove(x)},{merge:true}))},
  addPerson(n){if(people.some(p=>p.n.toLowerCase()===n.toLowerCase()))return false;
    const used=people.map(p=>p.c),c=PALETTE.find(x=>!used.includes(x))||PALETTE[people.length%PALETTE.length],o={n,c};
    people=[...people,o];remote((F,db)=>F.setDoc(F.doc(db,...P("meta","people")),{list:F.arrayUnion(o)},{merge:true}));return true},
  removePerson(n){const o=people.find(p=>p.n===n);if(!o)return;people=people.filter(p=>p!==o);
    if(me===n){me=null;store.set("me",null)}
    remote((F,db)=>F.setDoc(F.doc(db,...P("meta","people")),{list:F.arrayRemove(o)},{merge:true}))},
  addTopic(text){const t={id:uid(),text,by:me,votes:[],t:Date.now()};topics.push(t);
    remote((F,db)=>F.setDoc(F.doc(db,...P("topics",t.id)),{text,by:me,votes:[],t:t.t}))},
  editTopic(id,fields){const t=topics.find(t=>t.id===id);if(!t||t.by!==me)return;Object.assign(t,fields);
    remote((F,db)=>F.updateDoc(F.doc(db,...P("topics",id)),fields))},
  vote(id){const t=topics.find(t=>t.id===id);if(!t)return;const on=!t.votes.includes(me);
    t.votes=on?[...t.votes,me]:t.votes.filter(n=>n!==me);
    remote((F,db)=>F.updateDoc(F.doc(db,...P("topics",id)),{votes:on?F.arrayUnion(me):F.arrayRemove(me)}))},
  addPrayer(name,text){const p={id:uid(),name,text,by:me,done:false,t:Date.now()};prayers.push(p);
    remote((F,db)=>F.setDoc(F.doc(db,...P("prayers",p.id)),{name,text,by:me,done:false,t:p.t}))},
  toggleDone(id){const p=prayers.find(p=>p.id===id);if(!p||p.by!==me)return;p.done=!p.done;
    remote((F,db)=>F.updateDoc(F.doc(db,...P("prayers",id)),{done:p.done}))},
  addWish(text){const w={id:uid(),text,by:me,t:Date.now()};wishes.push(w);
    remote((F,db)=>F.setDoc(F.doc(db,...P("wishes",w.id)),{text,by:me,t:w.t}))},
  remove(kind,id){
    const coll={topic:"topics",prayer:"prayers",wish:"wishes"}[kind];
    const lists={topic:topics,prayer:prayers,wish:wishes};const x=lists[kind].find(i=>i.id===id);if(!x||x.by!==me)return;
    if(kind==="topic")topics=topics.filter(i=>i.id!==id);else if(kind==="prayer")prayers=prayers.filter(i=>i.id!==id);else wishes=wishes.filter(i=>i.id!==id);
    remote((F,db)=>F.deleteDoc(F.doc(db,...P(coll,id))))}
};

/* ---------- Helfer ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const color=n=>(people.find(p=>p.n===n)||{}).c||"#8e8e93";
const dot=(n,cls="")=>`<span class="dot ${cls}" style="background:${color(n)}" title="${esc(n)}">${esc((n||"?")[0])}</span>`;
const order=n=>{const i=people.findIndex(p=>p.n===n);return i<0?99:i};
function needMe(){if(!me){pick();return false}return true}
const delBtn=(id,kind)=>`<button class="del" data-del="${id}" data-kind="${kind}">Löschen</button>`;
const armDel=x=>{if(x.classList.contains("arm"))return true;x.classList.add("arm");const t=x.textContent;x.textContent="Wirklich?";setTimeout(()=>{if(x.isConnected){x.classList.remove("arm");x.textContent=t}},3000);return false};
function openSheet(kind,html,cls=""){
  if(document.querySelector(".sheet-bg"))return null;
  const bg=document.createElement("div");bg.className="sheet-bg";bg.dataset.kind=kind;
  bg.innerHTML=`<div class="sheet ${cls}" role="dialog">${html}</div>`;
  bg.addEventListener("click",e=>{if(e.target===bg)bg.remove()});
  document.body.appendChild(bg);return bg;
}

/* ---------- Ansichten ---------- */
function renderMe(){
  $("me").innerHTML=me?dot(me)+esc(me):'<span class="dot" style="background:var(--muted)">?</span>Wer bist du?';
}
function renderTreffen(){
  const u=upcoming(),m=curMeeting(),c=cur();sel=m.key;
  const short=d=>d.toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"});
  $("chips").innerHTML=u.map(x=>`<button class="chip ${x.key===m.key?"on":""}" data-meet="${x.key}" role="tab" aria-selected="${x.key===m.key}">${esc(x.label||short(x.date))}</button>`).join("")
    +`<button class="chip add" id="bAddMeet">+ Weiteres Treffen</button>`;
  $("whenLbl").textContent=m.weekly?"Wöchentliches Treffen":(m.label||"Weiteres Treffen");
  $("when").textContent=m.date.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  $("whenTime").textContent=(m.time||"")+" Uhr";
  $("whenDel").innerHTML=!m.weekly&&m.by===me?`<button class="del" id="bDelMeet">Löschen</button>`:"";
  $("cook").innerHTML=c.cook
    ?`<div class="row">${dot(c.cook)}<span class="name">${esc(c.cook)}</span><span class="tag">kocht</span></div>`
    :`<div class="empty">Noch niemand</div>`;
  const names=Object.keys(c.status).sort((a,b)=>(b===c.cook)-(a===c.cook)||order(a)-order(b));
  const yes=names.filter(n=>c.status[n]==="yes"),no=names.filter(n=>c.status[n]==="no");
  $("countLabel").textContent=`Dabei · ${yes.length}`;
  const rows=yes.map(n=>`<div class="row yes">${dot(n)}<span class="name">${esc(n)}${n===me?" (du)":""}</span>${n===c.cook?'<span class="tag">kocht</span>':""}</div>`)
    .concat(no.map(n=>`<div class="row no">${dot(n)}<span class="name">${esc(n)}${n===me?" (du)":""}</span></div>`));
  $("list").innerHTML=rows.join("")||`<div class="empty">Noch keine Zusagen</div>`;
  $("bYes").classList.toggle("on",c.status[me]==="yes");
  $("bNo").classList.toggle("on",c.status[me]==="no");
  $("bCook").classList.toggle("on",c.cook===me);
  $("bCook").textContent=c.cook===me?"Ich koche nicht mehr":"Ich koche";
}
function renderThemen(){
  const list=[...topics].sort((a,b)=>b.votes.length-a.votes.length||(a.t||0)-(b.t||0));
  $("topics").innerHTML=list.map(t=>{
    const mine=t.votes.includes(me);
    return `<div class="row">${dot(t.by)}
      <span class="name link" data-topic="${t.id}">${esc(t.text)}${t.notes?'<span class="ntag">· Notiz</span>':""}
        <span class="voters">${t.votes.map(v=>dot(v,"sm")).join("")}</span></span>
      <button class="pill ${mine?"on":""}" data-vote="${t.id}" aria-pressed="${mine}" aria-label="Interessiert mich auch"><span aria-hidden="true">🙋</span> ${t.votes.length}</button>
    </div>`}).join("")||`<div class="empty">Noch keine Themen</div>`;
}
function renderGebet(){
  const by=[...new Set(prayers.map(p=>p.by))].sort((a,b)=>(b===me)-(a===me));
  $("prayers").innerHTML=by.map(a=>`<div class="group">
    <div class="row head">${dot(a)}<span class="name">${esc(a)}${a===me?" (du)":""}</span></div>
    ${prayers.filter(p=>p.by===a).sort((x,y)=>(y.t||0)-(x.t||0)).map(p=>`<div class="row sub-row ${p.done?"done":""}">
      <span class="name">${esc(p.name)}${p.text?`<span class="sub">${esc(p.text)}</span>`:""}</span>
      ${a===me?delBtn(p.id,"prayer")+`<button class="pill done ${p.done?"on":""}" data-done="${p.id}" aria-pressed="${p.done}" aria-label="Erhört">✓</button>`:(p.done?'<span class="tag">✓ erhört</span>':"")}
    </div>`).join("")}
  </div>`).join("")||`<div class="group"><div class="empty">Noch keine Anliegen</div></div>`;
}
function render(){renderMe();renderTreffen();renderThemen();renderGebet()}

/* ---------- Treffen: Knöpfe ---------- */

$("bYes").onclick=()=>act(()=>ops.setStatus(cur().status[me]==="yes"?null:"yes"));
$("bNo").onclick=()=>act(()=>ops.setStatus(cur().status[me]==="no"?null:"no"));
$("bCook").onclick=()=>act(()=>ops.setCook(cur().cook!==me));

/* Weiteres Treffen anlegen */

  if(!needMe())return;
  const t=new Date();t.setDate(t.getDate()+1);
  const bg=openSheet("meet",`<h2>Weiteres Treffen</h2><p>Zusätzlich zum wöchentlichen Treffen.</p>
    <form class="add" id="fMeet"><div class="group">
      <div class="field"><label for="mDate">Datum</label><input type="date" id="mDate" value="${ymd(t)}" min="${ymd(new Date())}"></div>
      <div class="field"><label for="mTime">Uhrzeit</label><input type="time" id="mTime" value="${esc(config.time)}"></div>
      <input id="mLabel" maxlength="30" placeholder="Name, z. B. Gebetsabend (optional)" autocomplete="off" style="border-top:1px solid var(--line)">
    </div><button class="btn on">Treffen anlegen</button></form>`);
  if(!bg)return;
  $("fMeet").onsubmit=e=>{e.preventDefault();const d=$("mDate").value,tm=$("mTime").value;if(!d||!tm)return;

/* ---------- Themen und Gebet: Formulare ---------- */

/* ---------- Notizseite zu einem Thema ---------- */
let openTopic=null,noteTimer=null;
function topicSheet(id){
  openTopic=id;
  const bg=openSheet("topic",`<div id="topicBody"></div>`,"tall");if(!bg)return;
  fillTopic();
}
function fillTopic(){
  const t=topics.find(t=>t.id===openTopic),box=$("topicBody");if(!box)return;
  if(!t){document.querySelector(".sheet-bg")?.remove();return}
  const mine=t.by===me;
  if(mine&&box.dataset.id===t.id&&box.contains(document.activeElement))return; // nicht beim Tippen überschreiben
  box.dataset.id=t.id;
  box.innerHTML=`<div style="display:flex;align-items:center;gap:10px">${dot(t.by)}<span class="tag">${esc(t.by)}${mine?" (du)":""} · 🙋 ${t.votes.length}</span>
      <span style="flex:1"></span><button class="del" id="tDone">Fertig</button></div>
    ${mine?`<input class="title-in" id="tTitle" maxlength="120" value="${esc(t.text)}" aria-label="Titel">`:`<h2 style="font-size:24px">${esc(t.text)}</h2>`}
    <div class="group">${mine?`<textarea class="note-in" id="tNotes" placeholder="Beschreibe deine Idee genauer: Bibelstellen, Fragen, Gedanken …">${esc(t.notes||"")}</textarea>`
      :`<div style="padding:14px 16px;white-space:pre-wrap;min-height:80px">${t.notes?esc(t.notes):'<span style="color:var(--muted)">Noch keine Notiz.</span>'}</div>`}</div>
    ${mine?`<p class="note" id="tSaved">Wird automatisch gespeichert.</p><button class="del" data-del="${t.id}" data-kind="topic" style="align-self:center">Thema löschen</button>`:""}`;
  $("tDone").onclick=()=>document.querySelector(".sheet-bg")?.remove();
  if(mine){
    const save=()=>{clearTimeout(noteTimer);noteTimer=setTimeout(()=>{const v=$("tTitle").value.trim();ops.editTopic(t.id,{text:v||t.text,notes:$("tNotes").value});saveLocal();renderThemen();$("tSaved").textContent="Gespeichert"},500)};
    $("tTitle").oninput=save;$("tNotes").oninput=save;
  }
}

/* Klicks in Listen: Treffen, 🙋, Erhört, Thema öffnen, Löschen (zweimal tippen) */
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-meet]");if(c){sel=c.dataset.meet;renderTreffen();return}
  if(e.target.closest("#bAddMeet")){addMeeting();return}
  const dm=e.target.closest("#bDelMeet");if(dm){if(armDel(dm))act(()=>ops.removeExtra(curMeeting().x.id));return}
  const tp=e.target.closest("[data-topic]");if(tp){topicSheet(tp.dataset.topic);return}
  const v=e.target.closest("[data-vote]"),d=e.target.closest("[data-done]"),x=e.target.closest("[data-del]");
  if(v)act(()=>ops.vote(v.dataset.vote));
  if(d)act(()=>ops.toggleDone(d.dataset.done));
  if(x&&armDel(x)){act(()=>ops.remove(x.dataset.kind,x.dataset.del));if(x.dataset.kind==="topic")document.querySelector(".sheet-bg")?.remove();if(x.dataset.kind==="wish")fillWishes()}
});

/* ---------- Benachrichtigungen ---------- */
let notif=store.get("notif",{remind:"off",prayers:false});
const notifOn=()=>notif.remind!=="off"||notif.prayers;
const devId=store.get("dev",null)||(()=>{const d=uid();store.set("dev",d);return d})();
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
async function saveDevice(){ // Handy bei Firebase anmelden, damit es Nachrichten bekommt
  const M=await import(FB+"firebase-messaging.js");
  if(!(await M.isSupported()))throw new Error("unsupported");
  const reg=await navigator.serviceWorker.ready;
  const token=await M.getToken(M.getMessaging(R.app),{vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});
  await R.F.setDoc(R.F.doc(R.db,...P("devices",devId)),{token,name:me,remind:notif.remind,prayers:notif.prayers,t:Date.now()});
}
function syncName(){if(notifOn())remote((F,db)=>F.setDoc(F.doc(db,...P("devices",devId)),{name:me},{merge:true}))}
function notifMsg(t){const m=$("nMsg");if(m)m.textContent=t}
async function setNotif(change){
  const next={...notif,...change},on=next.remind!=="off"||next.prayers;
  const undo=t=>{notifMsg(t);fillSettings()};
  if(DEMO)return undo("In der Testversion nicht möglich.");
  if(!VAPID_KEY)return undo("Kommt bald: der Schlüssel aus Firebase fehlt noch.");
  if(!R.on)return undo("Keine Verbindung. Bitte später nochmal versuchen.");
  if(on&&!me){undo("");pick();return}
  if(on){
    if(isIOS&&!navigator.standalone)return undo("Auf dem iPhone geht das nur, wenn die App auf dem Home-Bildschirm liegt.");
    if(!("Notification" in window)||!("serviceWorker" in navigator))return undo("Dieses Handy kann keine Benachrichtigungen empfangen.");
    const perm=await Notification.requestPermission(); // muss direkt nach dem Tippen kommen
    if(perm!=="granted")return undo("Benachrichtigungen sind blockiert. Erlaube sie in den Handy-Einstellungen.");
    notifMsg("Wird eingeschaltet …");
    notif=next;
    try{await saveDevice();store.set("notif",notif);notifMsg("Eingeschaltet.")}
    catch(e){console.warn(e);notif=store.get("notif",{remind:"off",prayers:false});undo("Hat nicht geklappt. Bitte nochmal versuchen.")}
  }else{
    notif=next;store.set("notif",notif);
    remote((F,db)=>F.deleteDoc(F.doc(db,...P("devices",devId))));
    notifMsg("Ausgeschaltet.");
  }
}

function fillSettings(){
  if(!$("sTheme"))return;
  $("sTheme").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.th===theme));
  if(document.activeElement!==$("sDay"))$("sDay").value=config.weekday;
  if(document.activeElement!==$("sTime"))$("sTime").value=config.time;
  $("nRemind").value=notif.remind;$("nPrayer").checked=notif.prayers;
}
function fillWishes(){
  const l=$("wishList");if(!l)return;
  const list=[...wishes].sort((a,b)=>(b.t||0)-(a.t||0));
  l.hidden=!list.length;
  l.innerHTML=list.map(w=>`<div class="row">${dot(w.by)}<span class="name">${esc(w.text)}</span>${w.by===me?delBtn(w.id,"wish"):""}</div>`).join("");
}

/* ---------- Wer bist du? ---------- */
$("me").onclick=pick;
function pick(){
  const bg=openSheet("pick",`<h2>Wer bist du?</h2><p>Einmal antippen. Dein Handy merkt es sich.</p>
  <div class="group" id="pickList"></div>
  <form class="add" id="fPerson"><div class="group"><input id="newName" maxlength="20" placeholder="Neuer Name" autocomplete="off"></div>
  <button class="btn on" id="bPerson" disabled>Name hinzufügen</button></form>
  ${DEMO?"":`<p class="note">Gruppe <b>${esc(code||"")}</b> · <button type="button" class="del" id="bSwitch">Gruppe wechseln</button></p>`}`);
  if(!bg)return;
  fillPick();
  $("newName").oninput=()=>$("bPerson").disabled=!$("newName").value.trim();
  $("fPerson").onsubmit=e=>{e.preventDefault();const n=$("newName").value.trim().replace(/\s+/g," ");if(!n)return;
    if(!ops.addPerson(n)){$("newName").value="";$("newName").placeholder="Den Namen gibt es schon";return}
    saveLocal();me=n;store.set("me",me);syncName();render();bg.remove()};
  if($("bSwitch"))$("bSwitch").onclick=leaveGroup;
  bg.addEventListener("click",e=>{
    const x=e.target.closest("[data-delp]");
    if(x){if(armDel(x)){ops.removePerson(x.dataset.delp);saveLocal();render();fillPick()}return}
    const b=e.target.closest("[data-n]");
    if(b){me=b.dataset.n;store.set("me",me);syncName();render();bg.remove()}
  });
}
function fillPick(){
  const l=$("pickList");if(!l)return;
  l.innerHTML=people.map(p=>`<div class="row">${dot(p.n)}<button class="name pickname" data-n="${esc(p.n)}">${esc(p.n)}${p.n===me?" (du)":""}</button><button class="del" data-delp="${esc(p.n)}">Löschen</button></div>`).join("")
    ||`<div class="empty">Noch keine Namen. Schreib unten deinen Namen.</div>`;
}

/* ---------- Seiten wechseln (Tippen oder Wischen) ---------- */
const TITLES={treffen:"Bibelstudium",themen:"Themen",gebet:"Gebet"},ORDER=Object.keys(TITLES);
const curView=()=>{const v=(location.hash||"#treffen").slice(1);return TITLES[v]?v:"treffen"};
function route(){
  const view=curView();
  for(const k in TITLES)$("v-"+k).hidden=k!==view;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.v===view));
  $("title").textContent=TITLES[view];
  window.scrollTo(0,0);
}
addEventListener("hashchange",route);
let sx=null,sy=0;
document.addEventListener("touchstart",e=>{
  if(document.querySelector(".sheet-bg")||e.target.closest("input,textarea,select,.chips")){sx=null;return}
  sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{
  if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*.6)return;
  const i=ORDER.indexOf(curView())+(dx<0?1:-1);if(i>=0&&i<ORDER.length)location.hash=ORDER[i];
},{passive:true});

route();render();
if(!me&&(DEMO||code))pick();
initFirebase();

/* ---------- Als App installierbar (offline-fähig) ---------- */
if("serviceWorker" in navigator&&location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
