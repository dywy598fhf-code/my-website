<title>Bibelabend</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iOS-style grouped lists on a soft ground, one column, tab bar at the bottom */
:root{
  --bg:#f2f1ee; --card:#ffffff; --fg:#1c1c1e; --muted:#7a7873; --line:#e4e2dd;
  --btn:#1c1c1e; --btn-fg:#ffffff; --soft:#ebe9e4;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.23,1,.32,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0f10; --card:#1c1c1e; --fg:#f2f2f2; --muted:#9a9890; --line:#2c2c2e;
  --btn:#f2f2f2; --btn-fg:#111; --soft:#2a2a2c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0f10; --card:#1c1c1e; --fg:#f2f2f2; --muted:#9a9890; --line:#2c2c2e;
  --btn:#f2f2f2; --btn-fg:#111; --soft:#2a2a2c; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px;display:flex;flex-direction:column;gap:28px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:0}
.me{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--card);font-size:15px;font-weight:500}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:600;flex:none}
.dot.sm{width:10px;height:10px}
.label{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px 16px}
.group{background:var(--card);border-radius:14px;overflow:hidden}
.date{padding:18px 16px}
.date b{display:block;font-size:22px;letter-spacing:-.01em}
.date span{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:52px}
.row+.row{border-top:1px solid var(--line)}
.row .name{flex:1;min-width:0}
.row .tag{font-size:13px;color:var(--muted)}
.empty{padding:16px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:50px;border-radius:12px;background:var(--soft);font-weight:600;transition:transform .16s var(--ease),background .2s}
.btn:active{transform:scale(.97)}
.btn.on{background:var(--btn);color:var(--btn-fg)}
.wide{grid-column:1/-1}
.note{font-size:13px;color:var(--muted);text-align:center;margin:0}
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 16px}
.tab svg{width:24px;height:24px}
.tab.active{color:var(--fg)}
.tab[disabled]{opacity:.45}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s var(--ease)}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .35s var(--ease);display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:20px}
.sheet p{margin:0;color:var(--muted)}
.row.pick{width:100%;text-align:left}
.row.pick:active{background:var(--soft)}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.pop{animation:pop .3s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Bibelabend</h1>
    <button class="me" id="me" aria-label="Person wechseln"></button>
  </header>

  <section>
    <p class="label">Nächstes Treffen</p>
    <div class="group date"><b id="when"></b><span>19:30 Uhr</span></div>
  </section>

  <section>
    <p class="label">Es kocht</p>
    <div class="group" id="cook"></div>
  </section>

  <section>
    <p class="label" id="countLabel">Dabei</p>
    <div class="group" id="list"></div>
  </section>

  <div class="actions">
    <button class="btn" id="bYes">Ich bin dabei</button>
    <button class="btn" id="bNo">Ich kann nicht</button>
    <button class="btn wide" id="bCook">Ich koche</button>
  </div>
  <p class="note">Testversion mit Beispielnamen. Einträge bleiben vorerst nur auf deinem Handy.</p>
</div>

<nav class="tabs">
  <button class="tab active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Treffen</button>
  <button class="tab" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4.5h11a3 3 0 0 1 3 3V19.5H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h4"/></svg>Themen</button>
  <button class="tab" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Gebet</button>
</nav>

<script>
const PEOPLE=[
  {n:"Kevin",c:"#2f6fdb"},{n:"Anna",c:"#d9485f"},{n:"Jonas",c:"#2e9e6a"},
  {n:"Lea",c:"#c27c0e"},{n:"Micha",c:"#7b4fd6"},{n:"Sarah",c:"#d0557f"},
  {n:"Tim",c:"#1597a6"},{n:"Ruth",c:"#8a6a4f"}
];
const color=n=>(PEOPLE.find(p=>p.n===n)||{}).c||"#888";
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

// Beispiel-Zustand
let state=load("ba-state",{cook:"Anna",yes:["Anna","Jonas","Lea","Tim"],no:["Micha"]});
let me=load("ba-me",null);

function nextThursday(){
  const d=new Date();d.setHours(0,0,0,0);
  d.setDate(d.getDate()+((4-d.getDay()+7)%7));
  return d.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
}
const dot=(n,cls="")=>`<span class="dot ${cls}" style="background:${color(n)}">${cls?"":n[0]}</span>`;

function render(){
  document.getElementById("when").textContent=nextThursday();
  document.getElementById("me").innerHTML=me?dot(me)+me:'<span class="dot" style="background:var(--muted)">?</span>Wer bist du?';
  document.getElementById("cook").innerHTML=state.cook
    ?`<div class="row pop">${dot(state.cook)}<span class="name">${state.cook}</span><span class="tag">kocht</span></div>`
    :`<div class="empty">Noch niemand. Tippe auf „Ich koche“.</div>`;
  document.getElementById("countLabel").textContent=`Dabei · ${state.yes.length}`;
  const rows=state.yes.map(n=>`<div class="row">${dot(n)}<span class="name">${n}${n===me?" (du)":""}</span>${n===state.cook?'<span class="tag">kocht</span>':""}</div>`)
    .concat(state.no.map(n=>`<div class="row" style="opacity:.5">${dot(n)}<span class="name">${n}</span><span class="tag">kann nicht</span></div>`));
  document.getElementById("list").innerHTML=rows.join("")||`<div class="empty">Noch keine Zusagen.</div>`;
  document.getElementById("bYes").classList.toggle("on",state.yes.includes(me));
  document.getElementById("bNo").classList.toggle("on",state.no.includes(me));
  document.getElementById("bCook").classList.toggle("on",state.cook===me);
  document.getElementById("bCook").textContent=state.cook===me?"Ich koche nicht mehr":"Ich koche";
}
function set(fn){if(!me){pick();return}fn();save("ba-state",state);render()}
const drop=n=>{state.yes=state.yes.filter(x=>x!==n);state.no=state.no.filter(x=>x!==n)};
document.getElementById("bYes").onclick=()=>set(()=>{const was=state.yes.includes(me);drop(me);if(!was)state.yes.push(me)});
document.getElementById("bNo").onclick=()=>set(()=>{const was=state.no.includes(me);drop(me);if(state.cook===me)state.cook=null;if(!was)state.no.push(me)});
document.getElementById("bCook").onclick=()=>set(()=>{if(state.cook===me){state.cook=null}else{state.cook=me;drop(me);state.yes.unshift(me)}});
document.getElementById("me").onclick=pick;

function pick(){
  const bg=document.createElement("div");bg.className="sheet-bg";
  bg.innerHTML=`<div class="sheet" role="dialog" aria-label="Wer bist du?"><h2>Wer bist du?</h2><p>Einmal antippen. Dein Handy merkt es sich.</p>
  <div class="group">${PEOPLE.map(p=>`<button class="row pick" data-n="${p.n}">${dot(p.n)}<span class="name">${p.n}</span></button>`).join("")}</div></div>`;
  bg.onclick=e=>{const b=e.target.closest("[data-n]");if(b){me=b.dataset.n;save("ba-me",me);render()}if(b||e.target===bg)bg.remove()};
  document.body.appendChild(bg);
}
render();
if(!me)pick();
</script>
